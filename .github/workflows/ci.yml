name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e python/kyuubi-client -e "python/airflow-kyuubi[airflow]" pytest
      - run: pytest python/kyuubi-client python/airflow-kyuubi
