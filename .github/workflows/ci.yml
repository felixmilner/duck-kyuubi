name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e python/kyuubi-client -e "python/airflow-kyuubi[airflow]" pytest
      - run: pytest python/kyuubi-client python/airflow-kyuubi

  # Kyuubi 1.12.0 on the runner with the plugins: session policy, launcher catalog and refusals, the client
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        with:
          path: .local/apache-kyuubi-1.12.0-bin.tgz
          key: kyuubi-1.12.0-bin
      - run: pip install -e python/kyuubi-client pytest
      - run: examples/local/smoke-test.sh -v
      - name: Kyuubi's logs
        if: failure()
        run: |
          tail -n 200 .local/kyuubi-smoke.log || true
          find .local/apache-kyuubi-1.12.0-bin/logs .local/apache-kyuubi-1.12.0-bin/work -type f -name '*log*' \
            -exec tail -n 100 {} + || true

  # Both shims end to end on kind: the images, the manifests, the Quack server and real job pods
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: helm/kind-action@v1
        with:
          cluster_name: duck-kyuubi
      - run: pip install -e python/kyuubi-client pytest
      - run: examples/kubernetes/e2e.sh -v
        env:
          KIND_CLUSTER: duck-kyuubi
      - name: Cluster state and logs
        if: failure()
        run: |
          set +e
          kubectl get pods -A -o wide
          kubectl -n duck-kyuubi describe pods
          kubectl -n duck-kyuubi logs deploy/quack-server --tail=200
          kubectl -n duck-kyuubi logs deploy/kyuubi --tail=300
          kubectl -n duck-kyuubi exec deploy/kyuubi -- sh -c 'find /opt/kyuubi/work -type f -name "*log*" -exec tail -n 200 {} +'
          kubectl -n spark-alice describe pods
