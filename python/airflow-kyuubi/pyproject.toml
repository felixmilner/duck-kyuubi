[project]
name = "airflow-kyuubi"
version = "0.1.0"
description = "Airflow operator that runs jobs through the duck-kyuubi launcher on Apache Kyuubi"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# Airflow itself comes from the environment that runs the DAGs (2.x or 3.x); only the client is ours.
dependencies = ["kyuubi-client"]

[project.optional-dependencies]
airflow = ["apache-airflow>=2.9"]

[tool.uv.sources]
kyuubi-client = { path = "../kyuubi-client", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_kyuubi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running Kyuubi (KYUUBI_URL)"]
